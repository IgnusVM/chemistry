services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chemistry
      POSTGRES_PASSWORD: chemistry
      POSTGRES_DB: chemistry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chemistry -d chemistry"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
